name: Run Telegram TTS Bot

on:
  schedule:
    # يعيد تشغيل نفسه كل 5 ساعات تلقائياً لضمان عدم توقفه
    - cron: '0 */5 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

# إيقاف النسخة القديمة تلقائياً وتشغيل النسخة الجديدة فوراً عند أي تعديل
concurrency:
  group: telegram-tts-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py