name: Run Telegram TTS Bot

on:
  schedule:
    # إعادة تشغيل البوت تلقائياً كل 5 ساعات لضمان العمل المستمر
    - cron: '0 */5 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

# إعطاء الإذن للجلسة بالتحكم في العمليات الأخرى وإلغائها
permissions:
  actions: write
  contents: read

# منع التضارب التلقائي
concurrency:
  group: telegram-tts-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: استدعاء ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # الخطوة 2 (الميزة الجديدة): إغلاق وقتل جميع العمليات الأخرى الشغالة فوراً
      - name: Cancel all other running workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "جاري البحث عن أي عمليات سابقة شغالة لإغلاقها..."
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --json databaseId -q '.[].databaseId'); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "إيقاف العملية الشغالة رقم: $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --status queued --json databaseId -q '.[].databaseId'); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "إيقاف العملية المنتظرة رقم: $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done
          echo "تم تنظيف وإغلاق كل العمليات القديمة بنجاح!"
          sleep 5

      # الخطوة 3: تثبيت بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # الخطوة 4: تثبيت المكتبات
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # الخطوة 5: تشغيل البوت الجديد فقط
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py