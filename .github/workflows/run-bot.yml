name: Run Telegram TTS Bot

on:
  schedule:
    # إعادة تشغيل البوت تلقائياً كل 5 ساعات لضمان العمل المستمر (موجود وشغال 100%)
    - cron: '0 */5 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

# إعطاء الصلاحيات للتحكم بالعمليات وإلغاء القديم
permissions:
  actions: write
  contents: read

# منع التضارب والتأكد من وجود جلسة واحدة فقط نشطة
concurrency:
  group: telegram-tts-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: جلب كود المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # الخطوة 2: إغلاق وقتل أي عملية سابقة فوراً لمنع التكرار
      - name: Cancel all other running workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "جاري البحث عن أي عمليات سابقة شغالة لإغلاقها..."
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --json databaseId -q '.[].databaseId'); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "إيقاف العملية الشغالة رقم: $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --status queued --json databaseId -q '.[].databaseId'); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "إيقاف العملية المنتظرة رقم: $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done
          echo "تم تنظيف كل الجلسات القديمة بنجاح!"
          sleep 3

      # الخطوة 3: تثبيت بيئة بايثون مع تفعيل الكاش (يمنع إعادة تحميل المكتبات كل مرة)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # الخطوة 4: تجهيز أداة FFmpeg لمعالجة الصوت في ثوانٍ معدودة وبدون رفع ملفات
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # الخطوة 5: تثبيت المكتبات (سيتم جلبها سريعاً من الكاش بعد أول جلسة)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # الخطوة 6: تشغيل البوت
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py